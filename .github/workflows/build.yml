name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 首次运行生成固定签名 keystore 并提交入库（[skip ci] 防循环），
      # 之后所有构建用同一签名，APK 可覆盖升级安装
      - name: Ensure signing keystore
        run: |
          if [ ! -f android_signing/voice_todo.keystore ]; then
            mkdir -p android_signing
            keytool -genkeypair -v -keystore android_signing/voice_todo.keystore \
              -alias voice_todo -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass voice_todo_2026 -keypass voice_todo_2026 \
              -dname "CN=voice_todo, OU=personal, O=jing, C=CN"
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add android_signing/voice_todo.keystore
            git commit -m "chore: add signing keystore [skip ci]"
            git push
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ 脚手架由 CI 生成（不入库），避免 gradle 版本与本地漂移
      - name: Generate android scaffold
        run: flutter create --platforms android --org com.jing --project-name voice_todo .

      - name: Patch android config
        run: python3 tool/patch_android.py

      - name: Fetch sherpa-onnx model
        run: bash tool/fetch_models.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice_todo-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
