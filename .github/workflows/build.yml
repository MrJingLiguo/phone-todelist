name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ 脚手架由 CI 生成（不入库），避免 gradle 版本与本地漂移
      - name: Generate android scaffold
        run: flutter create --platforms android --org com.jing --project-name voice_todo .

      - name: Patch android config
        run: python3 tool/patch_android.py

      - name: Fetch sherpa-onnx model
        run: bash tool/fetch_models.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice_todo-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
